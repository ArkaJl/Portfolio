<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерфейсы — Портфолио</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        html {
            scrollbar-gutter: stable;
            scroll-behavior: smooth;
        }
        nav {
            min-height: 52px;
            display: flex;
            align-items: center;
        }
        nav > div {
            width: 100%;
            align-items: center;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }
        nav > div::-webkit-scrollbar { display: none; }
        nav a {
            display: inline-block;
            white-space: nowrap;
        }

        .project-gallery {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.75rem;
            align-items: start;
        }
        @media (max-width: 1100px) {
            .project-gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (max-width: 768px) {
            .project-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 480px) {
            .project-gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.5rem;
            }
        }

        .project-gallery .cell {
            border: 1px solid #374151;       /* gray-700 */
            border-radius: 0.5rem;
            background: #1f2937;             /* gray-800 */
            padding: 0.25rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
        }
        .project-gallery .cell:hover {
            transform: translateY(-2px);
            border-color: #3b82f6;           /* blue-500 */
            box-shadow: 0 8px 20px rgba(0,0,0,.5);
        }

        .project-gallery img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            object-fit: contain;
            border-radius: 0.375rem;
            cursor: zoom-in;
            background: #111827;
        }

        #lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,.92);
            padding: 1rem;
        }
        #lightbox.open { display: flex; }
        #lightbox img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: .5rem;
        }
        #lightbox .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.25rem;
            font-size: 2rem;
            line-height: 1;
            color: #fff;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- Навигация -->
    <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex gap-6 text-sm">
            <a href="index.html" class="hover:text-blue-400 transition">Главная</a>
            <a href="3d-models.html" class="hover:text-blue-400 transition">3D Модели</a>
            <a href="interfaces.html" class="text-blue-400 font-semibold">Интерфейсы</a>
            <a href="pet-projects.html" class="hover:text-blue-400 transition">Pet-проекты</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-10">

        <!-- Секция 1: Верстка соцсети -->
        <section class="mb-16">
            <h1 class="text-3xl font-bold mb-6 border-b border-gray-700 pb-3">
                1. Верстка интерфейсов для соцсети с использованием Tailwind CSS
            </h1>
            <div class="project-gallery">
                <div class="cell"><img src="pictures/1/photo_7_2026-10-14_17-44-14.jpg" alt="photo_7" loading="lazy"></div>
                <div class="cell"><img src="pictures/1/photo_3_2026-10-14_17-44-14.jpg" alt="photo_3" loading="lazy"></div>
                <div class="cell"><img src="pictures/1/photo_1_2026-10-14_17-44-14.jpg" alt="photo_1" loading="lazy"></div>
                <div class="cell"><img src="pictures/1/photo_2_2026-10-14_17-44-14.jpg" alt="photo_2" loading="lazy"></div>
                <div class="cell"><img src="pictures/1/photo_4_2026-10-14_17-44-14.jpg" alt="photo_4" loading="lazy"></div>
                <div class="cell"><img src="pictures/1/photo_5_2026-10-14_17-44-14.jpg" alt="photo_5" loading="lazy"></div>
                <div class="cell"><img src="pictures/1/photo_8_2026-10-14_17-44-14.jpg" alt="photo_8" loading="lazy"></div>
            </div>
        </section>

        <!-- Секция 2: Страницы Desktop-приложения -->
        <section class="mb-16">
            <h2 class="text-3xl font-bold mb-6 border-b border-gray-700 pb-3">
                2. Разработанные страницы для Desktop-приложения по макетам Figma
            </h2>
            <div class="project-gallery">
                <div class="cell"><img src="pictures/2/Панель авторизации.png" alt="Панель авторизации" loading="lazy"></div>
                <div class="cell"><img src="pictures/2/Панель администратора/Группы/Группа - Пользователи.png" alt="Группа - Пользователи" loading="lazy"></div>
                <div class="cell"><img src="pictures/2/Панель преподавателя/Группы/Группа - Создание сессии.png" alt="Группа - Создание сессии" loading="lazy"></div>
                <div class="cell"><img src="pictures/2/Панель студента/Сессии/Сессия - Управление.png" alt="Сессия - Управление" loading="lazy"></div>
                <div class="cell"><img src="pictures/2/Панель преподавателя/Сессии/Сессия - Аудит.png" alt="Сессия - Аудит" loading="lazy"></div>
                <div class="cell"><img src="pictures/2/Панель преподавателя/Сессии/Сессия - Выставление оценок.png" alt="Сессия - Выставление оценок" loading="lazy"></div>
            </div>
        </section>

        <!-- Секция 3: Видео -->
        <section class="mb-16">
            <h3 class="text-3xl font-bold mb-6 border-b border-gray-700 pb-3">
                Видео-демонстрация разработанного приложения
            </h3>
            <a href="pictures/2/видеодемонстрация.mp4" target="_blank" class="text-blue-400 hover:underline">
                видеодемонстрация.mp4
            </a>
        </section>

    </main>

    <footer class="border-t border-gray-700 py-6 text-center text-sm text-gray-500">
        © 2026 Портфолио
    </footer>

    <!-- Полноэкранный просмотр изображений -->
    <div id="lightbox" aria-hidden="true">
        <span class="close-btn" aria-label="Закрыть">&times;</span>
        <img src="" alt="Просмотр изображения">
    </div>

    <script>
        (function () {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = lightbox.querySelector('img');
            const closeBtn = lightbox.querySelector('.close-btn');

            function openLightbox(src, alt) {
                lightboxImg.src = src;
                lightboxImg.alt = alt || '';
                lightbox.classList.add('open');
                lightbox.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightbox.classList.remove('open');
                lightbox.setAttribute('aria-hidden', 'true');
                lightboxImg.src = '';
                document.body.style.overflow = '';
            }

            document.querySelectorAll('.project-gallery img').forEach(img => {
                img.addEventListener('click', () => openLightbox(img.src, img.alt));
            });

            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox || e.target === closeBtn) closeLightbox();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
            });
        })();
    </script>

</body>
</html>
